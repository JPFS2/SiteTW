    <script>    $(function () { $("#example1").DataTable({ "responsive": true, "lengthChange": false, "autoWidth": false, "buttons": ["copy", "csv", "excel", "pdf", "print", "colvis"] }).buttons().container().appendTo('#example1_wrapper .col-md-6:eq(0)'); $('#example2').DataTable({ "paging": true, "lengthChange": false, "searching": false, "ordering": true, "info": true, "autoWidth": false, "responsive": true, }); }); $(document).ready(function () {        // quando clicar em alguma tarefa acionar o ajax        $(".check-tarefas").click(function (e) {             // pegar o id da terefa            var tarefa = $(this).attr('id');            var status = 0;            if ($(this).is(':checked')) {                status = 1;            } else {                status = 0;            }            $.ajax({                url: '{{URL}}/admin/atualizardtftarefa',                method: 'POST',                data: {                    codigo: tarefa,                    status: status                },                success: function(data) {                    alert('Tarefa finalizada')                },                error: function(error) {                    console.log(error)                    alert('Error')                }             });        });    });</script>
