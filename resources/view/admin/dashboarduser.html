<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!---- Grafico Linear de venda por dia ----->
<script>
    const ctxLucroDiario = document.getElementById('lucroDiario');

    const labels = {{diasMes}};
    const data = {
        labels: labels,
        datasets: [{
            label: 'Lucro',
            data: {{valorDiasMes}},
            fill: false,
            borderColor: 'rgb(75, 192, 192)',
            tension: 0.1
        }]
    };

    new Chart(ctxLucroDiario, {
        type: 'line',
        data: data,
    });

</script>

<!--- Grafico Barras, vendas por més  ---->
<script>
    const ctx0 = document.getElementById('myChart');

    new Chart(ctx0, {
        type: 'bar',
        data: {
            labels: {{labels}},
    datasets: [{
        label: 'Total Vendas',
        data: {{valors}},
    borderWidth: 1
    }]
    },
    options: {
        scales: {
            y: {
                beginAtZero: true
            }
        }
    }
    });
</script>

<!--- Grafico Barras 2 ---->
<script>
    const ctx98 = document.getElementById('myChart2');

    new Chart(ctx98, {
        type: 'bar',
        data: {
            labels: {{labels}},
            datasets: [
                {
                    label: 'Vendas',
                    data: {{valors}},
                    borderWidth: 1,
                    backgroundColor: ['rgb(40,166,69)']
                },
                {
                    label: 'Custo',
                    data: {{custo}},
                    borderWidth: 1,
                    backgroundColor: ['rgb(219,53,69)']
                }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    position: 'top',
                },
                title: {
                    display: true,
                }
            }
        }

    });
</script>

<!--- Grafico era cicular  ---->
<script>
    const ctx94 = document.getElementById('line-chart');

    new Chart(ctx94, {
        type: 'doughnut',
        data: {
            labels: {{moedaMeses}},
            datasets: [{
                label: 'My First Dataset',
                data: {{valorMoedaMeses}},
                backgroundColor: [
                    'rgb(255, 99, 132)',
                    'rgb(54, 162, 235)',
                    'rgb(255, 205, 86)'
                ],
                hoverOffset: 4
            }]
        },
    });
</script>
